<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Avisos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B50}a:hover{color:#13302A}
.nav{position:absolute;left:0;right:0;bottom:0;height:76px;background:#FFFFFF;border-top:1px solid #E7E4DE;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 4px 14px;box-sizing:border-box}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:#5A6460;text-decoration:none;position:relative}
.nav a.on{color:#1F6B50;font-weight:600}
.nb{position:absolute;top:0;left:calc(50% + 6px);background:#B83D62;color:#FFFFFF;font-size:10px;font-weight:700;border-radius:999px;padding:1px 6px}
.gt{font-size:13px;font-weight:600;letter-spacing:.06em;color:#5A6460;margin:6px 2px 0}
.it{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #EFECE7}
.snd{flex:none;height:44px;min-width:92px;padding:0 14px;border-radius:12px;font:600 15px 'Outfit',sans-serif;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6F5F2; font-family: 'Outfit', system-ui, sans-serif; color: #1B2421">
  <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 76px; overflow: auto; padding: 22px 16px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
    <header style="display: flex; flex-direction: column; gap: 2px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 600">Avisos</h1>
      <span style="font-size: 15px; color: #5A6460">{{pendTxt}}</span>
    </header>

    <button type="button" onClick="{{siguiente}}" style="height: 56px; border-radius: 14px; border: none; background: #5FBF9B; color: #13302A; font: 600 17px 'Outfit',sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"></path></svg>{{sigTxt}}
    </button>

    <sc-if value="{{todoEnviado}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0">
        <img src="/_blob/115c901f51d0cb397e1ca8cabc3f926c" alt="" style="width: 140px; height: auto">
        <span style="font-size: 17px; font-weight: 600">¡Todo enviado! 💌</span>
      </div>
    </sc-if>

    <span class="gt">PEDIDO DE TURNO</span>
    <section style="background: #FFFFFF; border: 1px solid #E7E4DE; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 16px; font-weight: 600">Mora <span style="font-weight: 400; color: #5A6460">· perro nuevo · Julieta</span></span>
        <span style="font-size: 14px; color: #3E4743">Baño y corte · pidió jueves 8 a las 15:00</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <a href="Turno.dc.html" style="height: 46px; border-radius: 12px; border: 1px solid #D9D5CE; color: #1B2421; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; text-decoration: none">Otro horario</a>
        <a href="Turno.dc.html" style="height: 46px; border-radius: 12px; background: #1F2A26; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; text-decoration: none">Aceptar</a>
      </div>
    </section>

    <span class="gt">RECORDAR · MIÉRCOLES 7</span>
    <section style="background: #FFFFFF; border: 1px solid #E7E4DE; border-radius: 18px; padding: 2px 16px">
      <sc-for list="{{manana}}" as="x" hint-placeholder-count="3">
        <div class="it" style="{{x.first}}">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 16px; font-weight: 600">{{x.perro}} <span style="font-weight: 400; color: #5A6460">· {{x.dueno}}</span></span>
            <span style="font-size: 13px; color: #5A6460">{{x.det}}</span>
          </span>
          <button class="snd" type="button" onClick="{{x.toggle}}" style="{{x.st}}">{{x.btn}}</button>
        </div>
      </sc-for>
    </section>

    <span class="gt">LES TOCA VOLVER</span>
    <section style="background: #FFFFFF; border: 1px solid #E7E4DE; border-radius: 18px; padding: 2px 16px">
      <sc-for list="{{vuelven}}" as="x" hint-placeholder-count="2">
        <div class="it" style="{{x.first}}">
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 16px; font-weight: 600">{{x.perro}} <span style="font-weight: 400; color: #5A6460">· {{x.dueno}}</span></span>
            <span style="font-size: 13px; color: {{x.detColor}}">{{x.det}}</span>
          </span>
          <button class="snd" type="button" onClick="{{x.toggle}}" style="{{x.st}}">{{x.btn}}</button>
        </div>
      </sc-for>
    </section>
  </div>

  <nav class="nav" aria-label="Principal">
    <a href="Hoy.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Hoy</a>
    <a href="Agenda.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Agenda</a>
    <a href="Ficha.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6.5" cy="9.5" r="1.8"></circle><circle cx="10" cy="5.8" r="1.8"></circle><circle cx="14.5" cy="5.8" r="1.8"></circle><circle cx="18" cy="9.5" r="1.8"></circle><path d="M12.2 11.5c-3 0-5.5 3.6-5.5 6.1 0 1.5 1.2 2.2 2.5 2 1.2-.2 2-.8 3-.8s1.8.6 3 .8c1.3.2 2.5-.5 2.5-2 0-2.5-2.5-6.1-5.5-6.1z"></path></svg>Perros</a>
    <a class="on" href="Avisos.dc.html" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"></path></svg>Avisos<sc-if value="{{hayPend}}" hint-placeholder-val="{{ true }}"><span class="nb">{{pend}}</span></sc-if></a>
    <a href="Negocio.dc.html"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="6" width="18" height="14" rx="2"></rect><path d="M3 10h18M16 15h2"></path></svg>Finanzas</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { enviados: {} };
  }
  renderVals() {
    const env = this.state.enviados;
    const manana = [
      { id: 'm1', perro: 'Bruno', dueno: 'Diego', det: '09:00 · Deslanado' },
      { id: 'm2', perro: 'Nala', dueno: 'Carla', det: '11:00 · Baño y corte' },
      { id: 'm3', perro: 'Pancho', dueno: 'Sofía', det: '13:00 · Uñas · sin confirmar' },
    ];
    const vuelven = [
      { id: 'v1', perro: 'Lola', dueno: 'Laura', det: 'Se pasó 6 días · cada ~5 semanas', detColor: '#8E2A4A' },
      { id: 'v2', perro: 'Simón', dueno: 'Paula', det: 'Le toca en 3 días · cada ~8 semanas', detColor: '#6E4300' },
    ];
    const orden = [...manana, ...vuelven].map(x => x.id);
    const pend = orden.filter(id => !env[id]).length;
    const toggle = id => () => this.setState({ enviados: { ...env, [id]: !env[id] } });
    const dec = (x, i) => ({
      ...x,
      first: i === 0 ? 'border-top: none' : '',
      btn: env[x.id] ? 'Enviado' : 'Enviar',
      st: env[x.id] ? 'background: #F6F5F2; color: #5A6460; border: none' : 'background: #FFFFFF; color: #1B2421; border: 1px solid #D9D5CE',
      toggle: toggle(x.id),
    });
    const sigId = orden.find(id => !env[id]);
    const sig = [...manana, ...vuelven].find(x => x.id === sigId);
    return {
      manana: manana.map(dec),
      vuelven: vuelven.map(dec),
      pend,
      hayPend: pend > 0,
      todoEnviado: pend === 0,
      pendTxt: pend ? `${pend} mensajes por mandar · 1 pedido` : 'Todo enviado · 1 pedido',
      sigTxt: sig ? `Enviar a ${sig.perro} (${orden.indexOf(sigId) + 1} de ${orden.length})` : 'Listo, no queda nada',
      siguiente: () => { if (sigId) this.setState({ enviados: { ...env, [sigId]: true } }); },
    };
  }
}
</script>
</body>
</html>
